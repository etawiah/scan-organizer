# scan-organizer compose file.
#
# Designed to run on a Debian Docker host that mounts the Synology scans share
# over NFS at ${SCANS_HOST_PATH:-/mnt/nas/scans}. The container itself does NOT
# run on the NAS. For a hands-off weekly batch, use `docker compose run --rm`
# from cron or a systemd timer — see cron.example and systemd/ for ready-made
# snippets.
#
# Environment:
#   SCANS_HOST_PATH         Host path where the NFS share is mounted
#   CONFIG_HOST_PATH        Host path mounted at /config. May contain
#                           taxonomy.yaml, private_terms.txt, and
#                           outbound_vocabulary.txt. Missing files fall
#                           through to the image's /app/config defaults.
#   SCAN_PROVIDER           anthropic | gemini | local-keyword
#   SCAN_MODEL              Optional model id override
#   ANTHROPIC_API_KEY       Required when SCAN_PROVIDER=anthropic
#   GEMINI_API_KEY          Required when SCAN_PROVIDER=gemini
#   SCAN_UID_GID            Container user:group (default 1033:100)
#
# Minimal weekly run (dry-run):
#   docker compose run --rm scan-organizer --dry-run
#
# Real weekly run:
#   docker compose run --rm scan-organizer

services:
  scan-organizer:
    image: scan-organizer:latest
    build:
      context: .
    # Run as the share owner so NFS writes land with the right uid/gid.
    # Override with SCAN_UID_GID (e.g. SCAN_UID_GID=1000:100).
    user: ${SCAN_UID_GID:-1033:100}
    environment:
      SCANS_ROOT: /scans
      SCAN_CONFIG_DIR: ${SCAN_CONFIG_DIR:-/config}
      SCAN_PROVIDER: ${SCAN_PROVIDER:-local-keyword}
      SCAN_MODEL: ${SCAN_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      LOCAL_ONLY_CATEGORIES: ${LOCAL_ONLY_CATEGORIES:-Finance-Bank,ID-Legal,Medical}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ${SCANS_HOST_PATH:?set SCANS_HOST_PATH to the NFS mountpoint, e.g. /mnt/nas/scans}
        target: /scans
      - type: bind
        source: ${CONFIG_HOST_PATH:-./config}
        target: /config
        read_only: true
    # Config resolution: $SCAN_CONFIG_DIR (/config) → /app/config → ./config.
    # Do not hard-require host files; a missing taxonomy.yaml or vocabulary
    # on the mount falls through to the baked-in /app/config copies.
    command: >-
      --non-interactive
    # The weekly batch is launched via `docker compose run --rm`, so no
    # restart policy is defined. Keep the service short-lived.
